<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASLAN Technologies</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root { --bg: #0b1120; --card: #1e293b; --accent: #2563eb; --accent2: #7c3aed; --text: #ffffff; --muted: #94a3b8; --success: #16a34a; --warn: #f59e0b; --danger: #ef4444; }
        body { background-color: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 600px; }
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { flex: 1; min-width: 90px; padding: 12px 8px; background: var(--card); color: var(--muted); border: 1px solid #334155; border-radius: 8px; font-weight: bold; cursor: pointer; text-align: center; font-size: 13px; }
        .tab-btn.active { background: var(--accent); color: var(--text); border-color: #3b82f6; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid #334155; display: none; }
        .card.active { display: block !important; }
        label { display: block; margin-top: 12px; margin-bottom: 6px; color: #cbd5e1; font-size: 14px; }
        textarea, select, input { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 8px; box-sizing: border-box; font-family: inherit; }
        button.action-btn { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        button.action-btn:disabled { background: #475569; cursor: not-allowed; }
        footer { margin-top: 30px; text-align: center; font-size: 12px; color: var(--muted); }
        footer a { color: var(--muted); text-decoration: none; margin: 0 5px; }
        /* AI Asistan */
        .chat-box { min-height: 280px; max-height: 400px; overflow-y: auto; padding: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; margin-bottom: 12px; }
        .msg { padding: 10px 14px; border-radius: 12px; margin-bottom: 10px; max-width: 85%; word-wrap: break-word; line-height: 1.5; font-size: 14px; }
        .msg.user { background: var(--accent); color: white; margin-left: auto; }
        .msg.bot { background: #1e3a8a; color: #e0e7ff; }
        .msg.error { background: var(--danger); color: white; }
        .msg.system { background: #334155; color: var(--muted); font-size: 12px; text-align: center; max-width: 100%; }
        .quota-bar { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: #0f172a; border-radius: 8px; margin-bottom: 10px; font-size: 13px; }
        .quota-count { color: var(--warn); font-weight: bold; }
        .loading { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: white; margin: 0 2px; animation: bounce 1.4s infinite ease-in-out both; }
        .loading:nth-child(1) { animation-delay: -0.32s; }
        .loading:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
    </style>
</head>
<body>

<div class="container">
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('tts')">🎙️ Ses</button>
        <button class="tab-btn" onclick="switchTab('hls')">📡 HLS</button>
        <button class="tab-btn" onclick="switchTab('ai')">🤖 Aslan AI</button>
        <button class="tab-btn" onclick="switchTab('ffmpeg')">🎬 FFmpeg</button>
    </div>

    <!-- SES STÜDYOSU -->
    <div id="panel-tts" class="card active">
        <h3>🎙️ Ses Stüdyosu (Edge TTS)</h3>
        <label>Metin:</label>
        <textarea id="tts-text" rows="3" placeholder="Seslendirilecek metni yazın..."></textarea>

        <label>Ses Karakteri:</label>
        <select id="tts-voice">
            <option value="tr-TR-AhmetNeural">Ahmet (Erkek)</option>
            <option value="tr-TR-EmelNeural">Emel (Kadın)</option>
        </select>

        <button id="btn-speak" class="action-btn" onclick="generateAudio()">Sesi Oluştur ve Çal</button>

        <div id="audio-box" style="display:none; margin-top:15px;">
            <audio id="player" controls style="width:100%;"></audio>
            <a id="dl-link" download="aslan_ses.mp3"><button class="action-btn" style="background:var(--success);">İndir (.mp3)</button></a>
        </div>
    </div>

    <!-- HLS MODÜLÜ -->
    <div id="panel-hls" class="card">
        <h3>📡 HLS Canlı Yayın</h3>
        <input type="text" id="hls-url" placeholder="https://...m3u8">
        <button class="action-btn" onclick="playHLS()">Yayını Başlat</button>
        <video id="hls-video" controls style="width:100%; margin-top:15px; display:none; border-radius:8px;"></video>
    </div>

    <!-- ASLAN AI ASİSTAN -->
    <div id="panel-ai" class="card">
        <h3>🤖 Aslan AI Asistan</h3>
        <p style="color:var(--muted); font-size:13px; margin-top:0;">Llama 3.3 70B • Türkçe optimize</p>

        <div class="quota-bar">
            <span>Günlük Hak:</span>
            <span class="quota-count" id="quota-display">--/8</span>
        </div>

        <div class="chat-box" id="chat-box">
            <div class="msg bot">Merhaba! Ben Aslan AI 🤖 Sana nasıl yardımcı olabilirim?</div>
        </div>

        <label>Mesajınız:</label>
        <textarea id="ai-input" rows="2" placeholder="Bir şey sor..." onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault(); sendAI();}"></textarea>

        <button id="btn-ai" class="action-btn" onclick="sendAI()">Gönder</button>
    </div>

    <!-- FFMPEG MİMARİSİ -->
    <div id="panel-ffmpeg" class="card">
        <h3>🎬 FFmpeg Garajı</h3>
        <p style="color:var(--muted); font-size:14px;">Medya işleme modülü hazır duruma getirildi.</p>
    </div>

    <footer>
        <a href="#privacy" onclick="alert('Gizlilik Politikası Aktif')">Gizlilik</a> |
        <a href="#terms" onclick="alert('Kullanım Koşulları Aktif')">Kullanım Koşulları</a>
    </footer>
</div>

<script>
function switchTab(name) {
    document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('panel-' + name).classList.add('active');
    event.target.classList.add('active');
}

async function generateAudio() {
    const text = document.getElementById('tts-text').value;
    const voice = document.getElementById('tts-voice').value;
    const btn = document.getElementById('btn-speak');
    const player = document.getElementById('player');
    const box = document.getElementById('audio-box');

    if (!text) return alert('Lütfen metin yazın!');

    btn.disabled = true;
    btn.innerText = 'İşleniyor...';

    try {
        const res = await fetch('/api/tts', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text, voice })
        });

        if (!res.ok) throw new Error('API Hatası: ' + res.status);

        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        player.src = url;
        document.getElementById('dl-link').href = url;
        box.style.display = 'block';
        player.play();
    } catch (e) {
        alert(e.message);
    } finally {
        btn.disabled = false;
        btn.innerText = 'Sesi Oluştur ve Çal';
    }
}

function playHLS() {
    const url = document.getElementById('hls-url').value;
    const video = document.getElementById('hls-video');
    if (!url) return;
    video.style.display = 'block';
    if (Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
    }
}

// AI Asistan İşlevleri
function appendMsg(text, type = 'bot') {
    const box = document.getElementById('chat-box');
    const div = document.createElement('div');
    div.className = 'msg ' + type;
    div.textContent = text;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
}

function updateQuota(remaining) {
    document.getElementById('quota-display').textContent = remaining + '/8';
}

async function sendAI() {
    const input = document.getElementById('ai-input');
    const btn = document.getElementById('btn-ai');
    const text = input.value.trim();
    if (!text) return;

    appendMsg(text, 'user');
    input.value = '';
    btn.disabled = true;
    btn.innerText = 'Düşünüyor...';

    const loadingId = 'ld-' + Date.now();
    const box = document.getElementById('chat-box');
    const loading = document.createElement('div');
    loading.className = 'msg bot';
    loading.id = loadingId;
    loading.innerHTML = '<span class="loading"></span><span class="loading"></span><span class="loading"></span>';
    box.appendChild(loading);
    box.scrollTop = box.scrollHeight;

    try {
        const res = await fetch('/api/ai', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text })
        });

        const data = await res.json();
        document.getElementById(loadingId).remove();

        if (!res.ok) {
            appendMsg(data.error || 'Bir hata oluştu', 'error');
        } else {
            appendMsg(data.reply, 'bot');
            if (typeof data.remaining === 'number') {
                updateQuota(data.remaining);
            }
        }
    } catch (e) {
        document.getElementById(loadingId).remove();
        appendMsg('Bağlantı hatası: ' + e.message, 'error');
    } finally {
        btn.disabled = false;
        btn.innerText = 'Gönder';
    }
}
</script>
</body>
</html>
